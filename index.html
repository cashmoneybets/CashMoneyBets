<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CASHMONEY·BETS — Live Scores & Safe Score HUD</title>
  <meta name="description" content="Scores live, animation de but en temps réel, stats animées et Safe Score /100 sur les matchs les plus sûrs à parier. HUD futuriste." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="nebula"></canvas>
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <div class="grid-overlay"></div>
  <div class="scanlines"></div>

  <nav>
    <div class="logo">CASHMONEY<span class="logo-dot">·</span>BETS</div>
    <div class="nav-links">
      <a href="#live" data-i18n="nav_live"></a>
      <a href="#safebets" data-i18n="nav_safe"></a>
      <a href="#stats" data-i18n="nav_stats"></a>
      <a href="#methode" data-i18n="nav_method"></a>
    </div>
    <div class="nav-right">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="fr" title="Français">🇫🇷</button>
        <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
        <button class="lang-btn" data-lang="de" title="Deutsch">🇩🇪</button>
      </div>
      <div class="hud-clock" id="hud-clock">--:--:--</div>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu">
    <a href="#live" data-i18n="nav_live"></a>
    <a href="#safebets" data-i18n="nav_safe"></a>
    <a href="#stats" data-i18n="nav_stats"></a>
    <a href="#methode" data-i18n="nav_method"></a>
  </div>

  <div class="ticker" id="ticker"></div>

  <header class="hero">
    <div class="hero-hud">
      <span class="badge" data-i18n="badge"></span>
      <h1 class="kinetic">
        <span class="k-line"><span>CASHMONEY</span></span>
        <span class="k-line k-accent"><span>·BETS</span></span>
      </h1>
      <p class="sub" id="hero-sub"></p>
      <div class="hero-actions">
        <a class="btn-hud" href="#live" data-i18n="btn_live"></a>
        <a class="btn-hud ghost" href="#safebets" data-i18n="btn_safe"></a>
      </div>
    </div>
    <div class="hero-ring" aria-hidden="true">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="core" id="hero-core">96.2</div>
    </div>
  </header>

  <div class="stats" id="statsbar">
    <div class="stat"><b id="stat-matches">0</b><span data-i18n="stat_matches"></span></div>
    <div class="stat"><b id="stat-score">0</b><span data-i18n="stat_score"></span></div>
    <div class="stat"><b id="stat-elite">0</b><span data-i18n="stat_elite"></span></div>
    <div class="stat"><b id="stat-live">0</b><span data-i18n="stat_live"></span></div>
  </div>

  <section id="live" class="section">
    <div class="section-head">
      <h2 class="section-title" data-i18n-html="live_title"></h2>
      <div class="live-meta">
        <span class="pulse-dot"></span>
        <span id="live-status" data-i18n="live_connecting"></span>
        <span class="refresh-info" id="refresh-info"></span>
      </div>
    </div>
    <div class="live-grid" id="live-grid">
      <div class="live-loading">⣿ INITIALISATION DU FLUX…</div>
    </div>
  </section>

  <section id="safebets" class="section">
    <div class="section-head">
      <h2 class="section-title" data-i18n-html="safe_title"></h2>
    </div>
    <p class="section-sub" data-i18n="safe_sub"></p>
    <div class="toolbar">
      <div class="filters">
        <button class="active" data-filter="all" data-i18n="f_all"></button>
        <button data-filter="elite" data-i18n="f_elite"></button>
        <button data-filter="solid" data-i18n="f_solid"></button>
        <button data-filter="value" data-i18n="f_value"></button>
        <button data-filter="can" data-i18n="f_can"></button>
        <button data-filter="nl" data-i18n="f_nl"></button>
      </div>
      <div class="sorts">
        <button class="active" data-sort="score" data-i18n="sort_score"></button>
        <button data-sort="odds" data-i18n="sort_odds"></button>
        <button data-sort="time" data-i18n="sort_time"></button>
      </div>
    </div>
    <div class="grid" id="grid"></div>

    <div class="parlay-banner" id="parlay">
      <div class="parlay-left">
        <h3 data-i18n="parlay_title"></h3>
        <p data-i18n="parlay_sub"></p>
      </div>
      <div class="parlay-right">
        <div class="parlay-odds" id="parlay-odds">1.42</div>
        <small data-i18n="parlay_lbl"></small>
      </div>
    </div>
  </section>

  <section id="stats" class="section">
    <div class="section-head">
      <h2 class="section-title" data-i18n-html="stats_title"></h2>
    </div>
    <div class="charts">
      <div class="chart-panel">
        <h3 data-i18n="chart_bars"></h3>
        <canvas id="chart-bars" height="300"></canvas>
      </div>
      <div class="chart-panel">
        <h3 data-i18n="chart_donut"></h3>
        <canvas id="chart-donut" height="300"></canvas>
        <div class="donut-legend" id="donut-legend"></div>
      </div>
    </div>
  </section>

  <section id="methode" class="section">
    <div class="section-head">
      <h2 class="section-title" data-i18n-html="method_title"></h2>
    </div>
    <div class="stats method-grid">
      <div class="stat"><b class="emoji">🧮</b><span data-i18n="m1"></span></div>
      <div class="stat"><b class="emoji">📈</b><span data-i18n="m2"></span></div>
      <div class="stat"><b class="emoji">🏟️</b><span data-i18n="m3"></span></div>
      <div class="stat"><b class="emoji">🎯</b><span data-i18n="m4"></span></div>
    </div>
  </section>

  <div id="goal-overlay">
    <div class="goal-shockwave"></div>
    <div class="goal-content">
      <div class="goal-ball">⚽</div>
      <div class="goal-text" id="goal-text">BUUUT !</div>
      <div class="goal-team" id="goal-team"></div>
      <div class="goal-scorer" id="goal-scorer"></div>
      <div class="goal-score" id="goal-score"></div>
    </div>
  </div>

  <footer>
    <span class="warn" data-i18n="warn"></span><br />
    <span data-i18n="footer"></span><br /><br />
    <span data-i18n-html="footer_brand"></span>
  </footer>

  <script src="i18n.js"></script>
  <script src="data.js"></script>
  <script src="live.js"></script>
  <script src="app.js"></script>
</body>
</html>
