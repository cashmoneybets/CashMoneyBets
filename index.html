<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CASHMONEY·BETS — Live Scores & Safe Score HUD</title>
  <meta name="description" content="Scores live, animation de but en temps réel, probabilités de buts et Safe Score /100 sur les matchs les plus sûrs à parier. HUD futuriste." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=73" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <div class="grid-overlay"></div>
  <div class="scanlines"></div>

  <nav>
    <a class="logo" href="#home" data-view="home">CASHMONEY<span class="logo-dot">·</span>BETS<sup class="ver">v6.8</sup></a>
    <div class="nav-links">
      <a href="#live" data-view="live" data-i18n="nav_live"></a>
      <a href="#avenir" data-view="avenir" data-i18n="nav_upcoming"></a>
      <a href="#acc" data-view="acc" data-i18n="nav_acc"></a>
      <a href="#bot" data-view="bot" data-i18n="nav_bot"></a>
    </div>
    <div class="nav-right">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="fr" title="Français" aria-label="Français"><img class="lang-flag" src="https://flagcdn.com/w80/fr.png" alt="FR" width="26" height="17"><small>FR</small></button>
        <button class="lang-btn" data-lang="en" title="English" aria-label="English"><img class="lang-flag" src="https://flagcdn.com/w80/gb.png" alt="EN" width="26" height="17"><small>EN</small></button>
        <button class="lang-btn" data-lang="de" title="Deutsch" aria-label="Deutsch"><img class="lang-flag" src="https://flagcdn.com/w80/de.png" alt="DE" width="26" height="17"><small>DE</small></button>
        <button class="lang-btn" data-lang="sq" title="Shqip" aria-label="Shqip"><img class="lang-flag" src="https://flagcdn.com/w80/al.png" alt="SQ" width="26" height="17"><small>SQ</small></button>
      </div>
      <div class="hud-clock" id="hud-clock">--:--:--</div>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu">
    <a href="#home" data-view="home" data-i18n="nav_home"></a>
    <a href="#live" data-view="live" data-i18n="nav_live"></a>
    <a href="#avenir" data-view="avenir" data-i18n="nav_upcoming"></a>
    <a href="#acc" data-view="acc" data-i18n="nav_acc"></a>
    <a href="#bot" data-view="bot" data-i18n="nav_bot"></a>
  </div>

  <div class="ticker" id="ticker"></div>

  <!-- ================= VUE ACCUEIL ================= -->
  <main class="view" id="view-home">
    <header class="hero">
      <div class="hero-hud">
        <span class="badge" data-i18n="badge"></span>
        <h1 class="kinetic">
          <span class="k-line"><span>CASHMONEY</span></span>
          <span class="k-line k-accent"><span>·BETS</span></span>
        </h1>
        <p class="sub" id="hero-sub"></p>
        <div class="hero-actions">
          <a class="btn-hud" href="#live"><span class="live-badge"><i class="live-dot"></i>LIVE</span><span data-i18n="btn_live"></span></a>
          <a class="btn-hud ghost" href="#avenir" data-i18n="btn_upcoming"></a>
          <a class="btn-hud ghost" href="#acc" data-i18n="btn_acc"></a>
          <a class="btn-hud ghost" href="#bot" data-i18n="btn_bot"></a>
        </div>
      </div>
      <figure class="hero-stadium">
        <img src="assets/stadium-hero.jpg?v=73" alt="Stadium" decoding="async">
        <figcaption class="hs-brand"><span class="hs-title">CASH MONEY BETS</span><span class="hs-sub">⚽ SAFE SCORE ENGINE</span></figcaption>
      </figure>
    </header>

    <section class="section menu-section">
      <div class="section-head">
        <h2 class="section-title" data-i18n-html="menu_title"></h2>
      </div>
      <p class="section-sub" data-i18n="menu_sub"></p>
      <div class="neural-menu">
        <a class="n-tile" href="#live" data-view="live">
          <span class="n-node nn1"></span><span class="n-node nn2"></span><span class="n-node nn3"></span><span class="n-node nn4"></span>
          <span class="n-icon"><span class="live-badge"><i class="live-dot"></i>LIVE</span></span>
          <b class="n-name" data-i18n="nav_live"></b>
          <small class="n-desc" data-i18n="menu_live_desc"></small>
          <span class="n-arrow">⟶</span>
        </a>
        <a class="n-tile" href="#avenir" data-view="avenir">
          <span class="n-node nn1"></span><span class="n-node nn2"></span><span class="n-node nn3"></span><span class="n-node nn4"></span>
          <span class="n-icon">📅</span>
          <b class="n-name" data-i18n="nav_upcoming"></b>
          <small class="n-desc" data-i18n="menu_upcoming_desc"></small>
          <span class="n-arrow">⟶</span>
        </a>
        <a class="n-tile" href="#acc" data-view="acc">
          <span class="n-node nn1"></span><span class="n-node nn2"></span><span class="n-node nn3"></span><span class="n-node nn4"></span>
          <span class="n-icon">⚡</span>
          <b class="n-name" data-i18n="nav_acc"></b>
          <small class="n-desc" data-i18n="menu_acc_desc"></small>
          <span class="n-arrow">⟶</span>
        </a>
        <a class="n-tile n-tile-bot" href="#bot" data-view="bot">
          <span class="n-node nn1"></span><span class="n-node nn2"></span><span class="n-node nn3"></span><span class="n-node nn4"></span>
          <span class="n-icon">🤖</span>
          <b class="n-name" data-i18n="nav_bot"></b>
          <small class="n-desc" data-i18n="menu_bot_desc"></small>
          <span class="n-arrow">⟶</span>
        </a>
        <a class="n-tile" href="#buts" data-view="buts">
          <span class="n-node nn1"></span><span class="n-node nn2"></span><span class="n-node nn3"></span><span class="n-node nn4"></span>
          <span class="n-icon">⚽</span>
          <b class="n-name" data-i18n="nav_buts"></b>
          <small class="n-desc" data-i18n="menu_buts_desc"></small>
          <span class="n-arrow">⟶</span>
        </a>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title" data-i18n-html="picks_title"></h2>
      </div>
      <p class="section-sub" data-i18n="picks_sub"></p>
      <div class="grid" id="top-grid"></div>
    </section>

    <section class="section parlay-section">
      <div class="parlay-banner" id="parlay">
        <div class="parlay-left">
          <h3 data-i18n="parlay_title"></h3>
          <p data-i18n="parlay_sub"></p>
        </div>
        <div class="parlay-right">
          <div class="parlay-odds" id="parlay-odds">1.42</div>
          <small data-i18n="parlay_lbl"></small>
        </div>
      </div>
    </section>

    <section class="section" id="methode">
      <div class="section-head">
        <h2 class="section-title" data-i18n-html="method_title"></h2>
      </div>
      <div class="stats method-grid">
        <div class="stat"><b class="emoji">🧮</b><span data-i18n="m1"></span></div>
        <div class="stat"><b class="emoji">📈</b><span data-i18n="m2"></span></div>
        <div class="stat"><b class="emoji">🏟️</b><span data-i18n="m3"></span></div>
        <div class="stat"><b class="emoji">🎯</b><span data-i18n="m4"></span></div>
      </div>
    </section>
  </main>

  <!-- ================= VUE LIVE ================= -->
  <main class="view" id="view-live">
    <section class="section">
      <div class="view-head-bar"><a class="btn-menu" href="#home" data-view="home" data-i18n="btn_menu"></a></div>
      <div class="section-head">
        <h2 class="section-title" data-i18n-html="live_title"></h2>
        <div class="live-meta">
          <span class="live-badge"><i class="live-dot"></i>LIVE</span>
          <span id="live-status" data-i18n="live_connecting"></span>
          <span class="refresh-info" id="refresh-info"></span>
        </div>
      </div>
      <div class="live-grid" id="live-grid">
        <div class="live-loading">⣿ INITIALISATION DU FLUX…</div>
      </div>
    </section>
  </main>

  <!-- ================= VUE GAMES TO COME ================= -->
  <main class="view" id="view-avenir">
    <section class="section">
      <div class="view-head-bar"><a class="btn-menu" href="#home" data-view="home" data-i18n="btn_menu"></a></div>
      <div class="section-head">
        <h2 class="section-title" data-i18n-html="up_title"></h2>
      </div>
      <p class="section-sub" data-i18n="up_sub"></p>
      <div class="grid" id="up-grid"></div>
    </section>
  </main>

  <!-- ================= VUE ACCUMULATEUR ================= -->
  <main class="view" id="view-acc">
    <section class="section">
      <div class="view-head-bar"><a class="btn-menu" href="#home" data-view="home" data-i18n="btn_menu"></a></div>
      <div class="section-head">
        <h2 class="section-title" data-i18n-html="acc_title"></h2>
      </div>
      <p class="section-sub" data-i18n="acc_sub"></p>
      <div class="grid acc-wrap" id="acc-grid"></div>
    </section>
  </main>

  <!-- ================= VUE BUTS ================= -->
  <main class="view" id="view-buts">
    <section class="section">
      <div class="view-head-bar"><a class="btn-menu" href="#home" data-view="home" data-i18n="btn_menu"></a></div>
      <div class="section-head">
        <h2 class="section-title" data-i18n-html="buts_title"></h2>
      </div>
      <p class="section-sub" data-i18n="buts_sub"></p>
      <div class="grid" id="buts-grid"></div>
    </section>
  </main>

  <main class="view" id="view-bot">
    <section class="section bot-section">
      <div class="view-head-bar"><a class="btn-menu" href="#home" data-view="home" data-i18n="btn_menu"></a></div>
      <div class="section-head">
        <h2 class="section-title" data-i18n-html="bot_title"></h2>
      </div>
      <p class="section-sub" data-i18n="bot_sub"></p>
      <div class="bot-shell">
        <div class="bot-chat" id="bot-chat"></div>
        <div class="bot-sugs" id="bot-sugs"></div>
        <form class="bot-bar" id="bot-form">
          <input id="bot-input" type="text" autocomplete="off" maxlength="200">
          <button class="bot-send" type="submit" data-i18n="bot_send"></button>
        </form>
      </div>
    </section>
  </main>

  <div id="goal-overlay">
    <div class="goal-shockwave"></div>
    <div class="goal-content">
      <div class="goal-ball">⚽</div>
      <div class="goal-text" id="goal-text">BUUUT !</div>
      <div class="goal-team" id="goal-team"></div>
      <div class="goal-scorer" id="goal-scorer"></div>
      <div class="goal-score" id="goal-score"></div>
    </div>
  </div>

  <footer>
    <span class="warn" data-i18n="warn"></span><br />
    <span data-i18n="footer"></span><br /><br />
    <span data-i18n-html="footer_brand"></span>
  </footer>

  <script src="i18n.js?v=73"></script>
  <script src="data.js?v=73"></script>
  <script src="scene.js?v=73"></script>
  <script src="live.js?v=73"></script>
  <script src="app.js?v=73"></script>
  <script src="bot.js?v=73"></script>
</body>
</html>
